<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D365 Staging Ingestion Portal</title>
    <!-- SheetJS CDN for 100% client-side Excel/CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; margin: 20px; background: #f4f5f7; color: #333; }
        .card { background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid #e1e4e8; }
        .flex { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .map-box { background: #f8f9fa; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; }
        .map-box label { font-size: 12px; font-weight: 700; color: #0078d4; display: block; margin-bottom: 4px; }
        select, input, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        select { background-color: #fff; }
        button { background: #0078d4; color: white; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #005a9e; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f2f5; color: #333; border: 1px solid #ccc; }
        .btn-secondary:hover { background: #e0e2e5; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
        th, td { border: 1px solid #e1e4e8; padding: 8px; text-align: left; font-size: 12px; white-space: nowrap; }
        th { background: #f0f2f5; font-weight: 600; color: #444; }
        .table-scroll { overflow-x: auto; max-height: 300px; overflow-y: auto; }
        .badge { background: #e1dfdd; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>

<!-- 1. FILE UPLOAD HEADER -->
<div class="card">
    <h2>📦 D365 Intake Arrival Line Staging Ingestion</h2>
    <div class="flex">
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
        <label>Header Start Row: 
            <input type="number" id="headerOffset" value="0" min="0" style="width:60px;">
        </label>
        <button id="uploadBtn" disabled onclick="uploadPayload()">Confirm & Upload to D365</button>
    </div>
</div>

<!-- 2. RAW UNMAPPED FILE PREVIEW -->
<div class="card" id="rawPreviewCard" style="display:none;">
    <div class="between">
        <h3>👁️ Raw File Preview (First 5 Rows)</h3>
        <div class="flex">
            <label><strong>Active Sheet:</strong></label>
            <select id="rawSheetSelect" onchange="renderRawPreview()"></select>
        </div>
    </div>
    <div id="rawPreviewContainer" class="table-scroll"></div>
</div>

<!-- 3. MAPPING & VENDOR PROFILES -->
<div class="card" id="mappingCard" style="display:none;">
    <h3>🛠️ Vendor Profile & Column Mapping</h3>
    <div class="flex" style="margin-bottom: 15px; background: #f0f4f8; padding: 12px; border-radius: 6px;">
        <label>Supplier Profile: 
            <select id="profileSelect" onchange="onProfileChange()"><option value="">Custom Mapping</option></select>
        </label>
        <input type="text" id="newVendorName" placeholder="New Supplier Profile Name">
        <button class="btn-secondary" onclick="saveVendorProfile()">Save Profile</button>
        <button class="btn-secondary" onclick="applyMapping()">Apply Mapping</button>
    </div>
    <div id="mappingGrid" class="grid"></div>
</div>

<!-- 4. TRANSFORMED PAYLOAD PREVIEW -->
<div class="card" id="previewCard" style="display:none;">
    <h3>📊 Transformed Data Preview (Ready for D365)</h3>
    <div id="previewContainer"></div>
</div>

<script>
// Replace with your actual Power Automate endpoint URL
const FLOW_URL = "https://b1a78497e32be5af85a1519f752e3d.4b.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/c97f0c8b5dc14beaa9fef7fa61c4c178/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=MoJYmkNSO9bcKeLUK6_4dMaE6BH5uYIpy8NwFr02ysU";

// Target fields required by D365 entity
const TARGET_FIELDS = [
    "DefinitionGroup", "ExecutionId", "IsSelected", "TransferStatus", "InventBatchId", 
    "InventDimension1", "InventDimension2", "InventDimension3", "InventDimension4", 
    "InventDimension5", "InventDimension6", "InventDimension7", "InventDimension8", 
    "InventDimension11", "InventLocationId", "InventQty", "InventSiteId", "ItemId", 
    "LicensePlateId", "PurchId", "ReadyForProcessing", "WHSASNItemRefRecId", "WHSLoadId", 
    "wMSLocationId", "ArrivalConfirmPost", "InventDimension1Ext", "InventDimension2Ext", 
    "InventDimension3Ext", "InventDimension4Ext", "InventDimension5Ext", "InventDimension6Ext", 
    "InventDimension7Ext", "InventDimension8Ext", "InventDimension11Ext", "ItemIdExt"
];

let rawWorkbookData = {};
let transformedPayloadData = {};
let availableSourceColumns = [];
let savedProfiles = {};

document.getElementById('fileInput').addEventListener('change', handleFile);
document.getElementById('headerOffset').addEventListener('change', handleFile);

// Load vendor profiles from local storage (or replace with SharePoint REST API call)
function loadSavedProfiles() {
    savedProfiles = JSON.parse(localStorage.getItem('vendor_mappings') || '{}');
    const select = document.getElementById('profileSelect');
    select.innerHTML = '<option value="">Custom Mapping</option>';
    Object.keys(savedProfiles).forEach(vendor => {
        select.innerHTML += `<option value="${vendor}">${vendor}</option>`;
    });
}
loadSavedProfiles();

function handleFile(e) {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return;

    const offset = parseInt(document.getElementById('headerOffset').value) || 0;
    const reader = new FileReader();

    reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        rawWorkbookData = {};
        availableSourceColumns = [];

        const sheetSelect = document.getElementById('rawSheetSelect');
        sheetSelect.innerHTML = '';

        workbook.SheetNames.forEach(sheetName => {
            sheetSelect.innerHTML += `<option value="${sheetName}">${sheetName}</option>`;
            const worksheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { range: offset, defval: "" });
            rawWorkbookData[sheetName] = json;

            if (json.length > 0) {
                Object.keys(json[0]).forEach(col => {
                    if (!availableSourceColumns.includes(col)) availableSourceColumns.push(col);
                });
            }
        });

        renderRawPreview();
        renderMappingControls();
        autoDetectProfile();
        applyMapping();

        document.getElementById('rawPreviewCard').style.display = 'block';
        document.getElementById('mappingCard').style.display = 'block';
        document.getElementById('uploadBtn').disabled = false;
    };

    reader.readAsArrayBuffer(file);
}

function renderRawPreview() {
    const container = document.getElementById('rawPreviewContainer');
    const selectedSheet = document.getElementById('rawSheetSelect').value;
    const rows = rawWorkbookData[selectedSheet] || [];

    if (rows.length === 0) {
        container.innerHTML = '<p style="color:#888;">No data found in this sheet.</p>';
        return;
    }

    const headers = Object.keys(rows[0]);
    let tableHtml = '<table><thead><tr>';
    headers.forEach(h => tableHtml += `<th>${h}</th>`);
    tableHtml += '</tr></thead><tbody>';

    rows.slice(0, 5).forEach(row => {
        tableHtml += '<tr>';
        headers.forEach(h => tableHtml += `<td>${row[h] !== undefined ? row[h] : ''}</td>`);
        tableHtml += '</tr>';
    });
    tableHtml += '</tbody></table>';

    container.innerHTML = tableHtml;
}

function renderMappingControls() {
    const grid = document.getElementById('mappingGrid');
    grid.innerHTML = '';

    const firstSheetName = Object.keys(rawWorkbookData)[0];
    const sampleRow = (rawWorkbookData[firstSheetName] && rawWorkbookData[firstSheetName][0]) ? rawWorkbookData[firstSheetName][0] : {};

    TARGET_FIELDS.forEach(field => {
        let optionsHtml = `<option value="[ Ignore Field ]">[ Ignore Field ]</option>`;
        
        availableSourceColumns.forEach(srcCol => {
            const sampleValue = sampleRow[srcCol] !== undefined ? String(sampleRow[srcCol]).trim() : '';
            const previewText = sampleValue ? ` (e.g. "${sampleValue.substring(0, 18)}")` : ' (empty)';
            
            const isMatch = srcCol.toLowerCase().trim() === field.toLowerCase().trim();
            optionsHtml += `<option value="${srcCol}" ${isMatch ? 'selected' : ''}>${srcCol}${previewText}</option>`;
        });

        grid.innerHTML += `
            <div class="map-box">
                <label>${field}</label>
                <select id="map_${field}" style="width:100%;">${optionsHtml}</select>
            </div>
        `;
    });
}

function autoDetectProfile() {
    let bestMatch = "", highestScore = 0;
    const allHeaders = availableSourceColumns.map(c => c.toLowerCase().trim());

    Object.entries(savedProfiles).forEach(([vendor, mapping]) => {
        const matches = Object.values(mapping).filter(src => allHeaders.includes(src.toLowerCase().trim())).length;
        if (matches > highestScore) {
            highestScore = matches;
            bestMatch = vendor;
        }
    });

    if (highestScore > 0) {
        document.getElementById('profileSelect').value = bestMatch;
        onProfileChange();
    }
}

function onProfileChange() {
    const profile = document.getElementById('profileSelect').value;
    if (!profile || !savedProfiles[profile]) return;

    const mapping = savedProfiles[profile];
    TARGET_FIELDS.forEach(field => {
        const select = document.getElementById(`map_${field}`);
        if (select) select.value = mapping[field] || "[ Ignore Field ]";
    });
    applyMapping();
}

function saveVendorProfile() {
    const vendorName = document.getElementById('newVendorName').value.trim();
    if (!vendorName) return alert('Enter a supplier profile name.');

    const mapping = {};
    TARGET_FIELDS.forEach(field => {
        const val = document.getElementById(`map_${field}`).value;
        if (val !== "[ Ignore Field ]") mapping[field] = val;
    });

    savedProfiles[vendorName] = mapping;
    localStorage.setItem('vendor_mappings', JSON.stringify(savedProfiles));
    loadSavedProfiles();
    document.getElementById('profileSelect').value = vendorName;
    alert(`Vendor Profile '${vendorName}' saved!`);
}

function applyMapping() {
    const currentMapping = {};
    TARGET_FIELDS.forEach(field => {
        currentMapping[field] = document.getElementById(`map_${field}`).value;
    });

    transformedPayloadData = {};
    Object.entries(rawWorkbookData).forEach(([sheet, rows]) => {
        transformedPayloadData[sheet] = rows.map(row => {
            const transformedRow = {};
            TARGET_FIELDS.forEach(target => {
                const src = currentMapping[target];
                transformedRow[target] = (src && src !== "[ Ignore Field ]") ? (row[src] || "") : "";
            });
            return transformedRow;
        });
    });

    renderPreview();
}

function renderPreview() {
    const container = document.getElementById('previewContainer');
    container.innerHTML = '';

    Object.entries(transformedPayloadData).forEach(([sheet, rows]) => {
        if (rows.length === 0) return;
        let tableHtml = `<div style="margin-top:15px;">
            <h4>Sheet: <span class="badge">${sheet}</span> (${rows.length} total rows)</h4>
            <div class="table-scroll"><table><thead><tr>`;
            
        TARGET_FIELDS.slice(0, 8).forEach(f => tableHtml += `<th>${f}</th>`);
        tableHtml += `</tr></thead><tbody>`;

        rows.slice(0, 5).forEach(row => {
            tableHtml += `<tr>`;
            TARGET_FIELDS.slice(0, 8).forEach(f => tableHtml += `<td>${row[f] || ''}</td>`);
            tableHtml += `</tr>`;
        });
        tableHtml += `</tbody></table></div></div>`;
        container.innerHTML += tableHtml;
    });

    document.getElementById('previewCard').style.display = 'block';
}

async function uploadPayload() {
    const file = document.getElementById('fileInput').files[0];
    const payload = {
        fileName: file.name,
        templateType: "TD_IntakeArrivalLineStaging",
        vendorProfile: document.getElementById('profileSelect').value || "Custom",
        data: transformedPayloadData
    };

    try {
        const res = await fetch(FLOW_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) alert('Successfully uploaded transformed payload to Power Automate!');
        else alert(`Error uploading: HTTP ${res.status}`);
    } catch (err) {
        alert(`Connection failed: ${err.message}`);
    }
}
</script>
</body>
</html>
