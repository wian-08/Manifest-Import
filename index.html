<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D365 Staging Ingestion Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; margin: 20px; background: #f4f5f7; color: #333; }
        .card { background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid #e1e4e8; }
        .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 10px; }
        .map-box { background: #f8f9fa; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; }
        .map-box label { font-size: 12px; font-weight: 700; color: #0078d4; display: block; margin-bottom: 4px; }
        select, input, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        select { background-color: #fff; }
        button { background: #0078d4; color: white; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #005a9e; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
        th, td { border: 1px solid #e1e4e8; padding: 8px; text-align: left; font-size: 12px; white-space: nowrap; }
        th { background: #f0f2f5; font-weight: 600; color: #444; }
        .table-scroll { overflow-x: auto; max-height: 300px; overflow-y: auto; }
        .badge { background: #0078d4; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-id { background: #107c41; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; font-family: monospace; }
        .section-header { margin-top: 15px; margin-bottom: 12px; color: #0078d4; font-size: 15px; border-bottom: 2px solid #e0e0e0; padding-bottom: 4px; }
        
        /* Collapsible Accordion Styles */
        .collapsible-header {
            background-color: #eef3f8;
            color: #0078d4;
            cursor: pointer;
            padding: 10px 14px;
            width: 100%;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            text-align: left;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .collapsible-header:hover { background-color: #e2ecf5; }
        .collapsible-content { display: none; padding-top: 5px; }
        .collapsible-content.active { display: block; }
        .toggle-icon { font-size: 12px; margin-left: 10px; }
    </style>
</head>
<body>

<!-- 1. FILE UPLOAD HEADER -->
<div class="card">
    <div class="between" style="margin-bottom: 10px;">
        <h2 style="margin: 0;">D365 Intake Arrival Line Staging Ingestion</h2>
        <div id="headerUploadIdDisplay" style="display:none;">
            <span style="font-size: 12px; font-weight: 700; color: #555;">Upload ID: </span>
            <span id="uploadIdHeaderBadge" class="badge-id">--</span>
        </div>
    </div>
    <div class="flex">
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
        <label>Header Start Row: 
            <input type="number" id="headerOffset" value="1" min="1" style="width:60px;">
        </label>
        <button id="uploadBtn" disabled onclick="uploadPayload()">Confirm & Upload to D365</button>
    </div>
</div>

<!-- 2. RAW UNMAPPED FILE PREVIEW -->
<div class="card" id="rawPreviewCard" style="display:none;">
    <div class="between">
        <h3>👁️ Raw File Preview (First 5 Rows)</h3>
        <div class="flex">
            <label><strong>Active Data Sheet:</strong></label>
            <select id="rawSheetSelect" onchange="onSheetChange()"></select>
        </div>
    </div>
    <div id="rawPreviewContainer" class="table-scroll"></div>
</div>

<!-- 3. CONFIGURATION: VENDOR & MAPPING -->
<div class="card" id="mappingCard" style="display:none;">
    <h3>🛠️ Ingestion Configuration & Column Mapping</h3>
    
    <!-- Vendor Profile Controls -->
    <div class="map-box" style="margin-bottom: 15px;">
        <h4 class="section-header" style="margin-top:0;">1. Supplier Profile Mapping (Dataverse Integration)</h4>
        <div class="flex">
            <label>Profile: 
                <select id="profileSelect" onchange="onProfileChange()"><option value="">Custom Mapping</option></select>
            </label>
            <label>Supplier: 
                <select id="supplierSelect" style="max-width: 320px;">
                    <option value="">-- Select Supplier --</option>
                </select>
            </label>
            <button class="btn-secondary" onclick="loadDataverseVendorProfiles(true)">🔄 Fetch Profiles</button>
            <button onclick="saveVendorProfile()">Save Profile to Dataverse</button>
        </div>
    </div>

    <!-- Field Mapping Section 1: Supplier Mapping (Collapsible) -->
    <button class="collapsible-header" onclick="toggleSection('supplierSection', 'supplierToggleIcon')">
        <span>2. Supplier Mapping (External Fields)</span>
        <span id="supplierToggleIcon" class="toggle-icon">▼ Show</span>
    </button>
    <div id="supplierSection" class="collapsible-content">
        <div id="supplierMappingGrid" class="grid"></div>
    </div>

    <!-- Field Mapping Section 2: D365 Mapping (Collapsible) -->
    <button class="collapsible-header" onclick="toggleSection('d365Section', 'd365ToggleIcon')">
        <span>3. D365 Core Mapping</span>
        <span id="d365ToggleIcon" class="toggle-icon">▼ Show</span>
    </button>
    <div id="d365Section" class="collapsible-content">
        <div id="d365MappingGrid" class="grid"></div>
    </div>
</div>

<!-- 4. TRANSFORMED PAYLOAD PREVIEW -->
<div class="card" id="previewCard" style="display:none;">
    <div class="between">
        <h3> Transformed Payload Preview (Unified Output)</h3>
        <div class="flex">
            <span><strong>Upload ID:</strong> <span id="uploadIdPreviewBadge" class="badge-id">--</span></span>
            <span id="recordCountBadge" class="badge">0 Records</span>
        </div>
    </div>
    <div id="previewContainer"></div>
</div>

<script>
// Toggle Accordion Function
function toggleSection(contentId, iconId) {
    const content = document.getElementById(contentId);
    const icon = document.getElementById(iconId);
    const isActive = content.classList.contains('active');

    if (isActive) {
        content.classList.remove('active');
        icon.innerText = '▼ Show';
    } else {
        content.classList.add('active');
        icon.innerText = '▲ Hide';
    }
}

// Power Automate Endpoints
const FLOW_URL = "https://b1a78497e32be5af85a1519f752e3d.4b.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/c97f0c8b5dc14beaa9fef7fa61c4c178/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=MoJYmkNSO9bcKeLUK6_4dMaE6BH5uYIpy8NwFr02ysU";
const FETCH_PROFILES_URL = "https://b1a78497e32be5af85a1519f752e3d.4b.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/e669b59cd03c4a40a5b1468ee1161fec/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OLQxMY1DV2lKSgQwXmQorwEp-GduVB-8j0HsgRWhILI";
const SAVE_PROFILE_URL = "https://b1a78497e32be5af85a1519f752e3d.4b.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/22/workflows/029f6c9d020441f98d77af45740e4a49/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=pKypZ4Kw9hNV62ebd1OofUJK21dP-oDM1jGpGYfu9So";
const FETCH_LOCATIONS_URL = "https://b1a78497e32be5af85a1519f752e3d.4b.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/01/workflows/d89a531daacd4aed9de7653612a5204b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=BFt4PpB7g8qe_zhKs2srjDdgqjtf9amNmzYs0Lv0E5o";
const FETCH_SUPPLIERS_URL = "https://b1a78497e32be5af85a1519f752e3d.4b.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/24/workflows/d105aa958ce24d79906bd7020067a44b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=8-tEpKNVn-6mE_NbQoJKA6Cwq-6CT__udRkfdzg3bOo";

// Complete target fields list
const BASE_FIELDS = [
    "ArrivalPort", "Vessel", "Voyage", "LoadingPortID", "OriginalDepartureDate", 
    "DepartureDate", "ArrivalWeek", "ArrivalDate", "ArrivalTime", "ExternalReference", 
    "Warehouse", "OnSiteDeliveryDate", "ContainerID", "BookingReference", "VendorAccount", 
    "PONumber", "ShippingLine", "ShippingCarrier", "ContractNumber", "IntendedCustomerAccount", 
    "ItemID", "Qty", "UnitID", "ProduceGrade", "ProduceVariety", "ProduceSize", 
    "ProduceCount", "ProduceColor", "CountryRegion", "BrandMark", "DistributionPackaging", 
    "BoxSpecification", "Owner", "IntendedRetailer", "PalletID", "NumberOfPallets", 
    "TemTaleNumber", "EthyleneAbsorberLocation", "GrowerID", "GGNNumber", "PackingDate", 
    "SupplierPackhouse", "Seal", "MultiGGNGrower", "DepartmentCode", "SupplierBatchNumber", "HarvestDate"
];

// Display Labels Map
const FIELD_LABELS = {
    "ArrivalPort": "Arrival Port",
    "LoadingPortID": "Loading Port ID",
    "OriginalDepartureDate": "Original Departure Date",
    "DepartureDate": "Departure Date",
    "ArrivalWeek": "Arrival Week",
    "ArrivalDate": "Arrival Date",
    "ArrivalTime": "Arrival Time (24h)",
    "ExternalReference": "External Reference",
    "OnSiteDeliveryDate": "On Site Delivery Date",
    "ContainerID": "Container ID",
    "BookingReference": "Booking Reference",
    "VendorAccount": "Vendor Account",
    "PONumber": "PO Number",
    "ShippingLine": "Shipping Line",
    "ShippingCarrier": "Shipping Carrier",
    "ContractNumber": "Contract Number",
    "IntendedCustomerAccount": "Intended Customer Account",
    "ItemID": "Item ID",
    "UnitID": "Unit ID",
    "ProduceGrade": "Produce Grade",
    "ProduceVariety": "Produce Variety",
    "ProduceSize": "Produce Size",
    "ProduceCount": "Produce Count",
    "ProduceColor": "Produce Color",
    "CountryRegion": "Country / Region",
    "BrandMark": "Brand / Mark",
    "DistributionPackaging": "Distribution Packaging",
    "BoxSpecification": "Box Specification",
    "IntendedRetailer": "Intended Retailer",
    "PalletID": "Pallet ID",
    "NumberOfPallets": "Number of Pallets",
    "TemTaleNumber": "TemTale Number",
    "EthyleneAbsorberLocation": "Ethylene Absorber Location",
    "GrowerID": "Grower ID",
    "GGNNumber": "GGN Number",
    "PackingDate": "Packing Date",
    "SupplierPackhouse": "Supplier Packhouse",
    "MultiGGNGrower": "Multi-GGN Grower",
    "DepartmentCode": "Department Code",
    "SupplierBatchNumber": "Supplier Batch Number",
    "HarvestDate": "Harvest Date"
};

// Generate full target list with 'Ext' suffixes for Supplier Section
let ALL_TARGET_FIELDS = [];
BASE_FIELDS.forEach(f => ALL_TARGET_FIELDS.push(`${f}Ext`));
ALL_TARGET_FIELDS = ALL_TARGET_FIELDS.concat(BASE_FIELDS);

let rawWorkbookData = {};
let transformedPayloadData = [];
let availableSourceColumns = [];
let vendorProfiles = {};
let supplierList = [];
let storageLocations = [];
let currentUploadId = "";
let currentSelectedSheet = "";

document.getElementById('fileInput').addEventListener('change', handleFile);
document.getElementById('headerOffset').addEventListener('change', handleFile);

function generateUploadId() {
    const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const randomSuffix = Math.random().toString(36).substring(2, 7).toUpperCase();
    return `UPL-${dateStr}-${randomSuffix}`;
}

function updateUploadIdDisplay() {
    if (!currentUploadId) currentUploadId = generateUploadId();
    document.getElementById('uploadIdHeaderBadge').innerText = currentUploadId;
    document.getElementById('uploadIdPreviewBadge').innerText = currentUploadId;
    document.getElementById('headerUploadIdDisplay').style.display = 'inline-block';
}

function getProp(obj, possibleKeys) {
    if (!obj || typeof obj !== 'object') return "";
    const foundKey = Object.keys(obj).find(k => 
        possibleKeys.some(pk => pk.toLowerCase() === k.toLowerCase())
    );
    return foundKey ? obj[foundKey] : "";
}

async function fetchEndpoint(url, defaultPayload = { action: "getData" }) {
    const attempts = [
        () => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(defaultPayload) }),
        () => fetch(url, { method: 'GET' }),
        () => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: "{}" })
    ];

    for (const attempt of attempts) {
        try {
            const res = await attempt();
            if (res.ok) return res;
        } catch (e) {
            console.warn("Attempt failed:", e);
        }
    }
    return await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(defaultPayload) });
}

async function loadSuppliers() {
    try {
        const res = await fetchEndpoint(FETCH_SUPPLIERS_URL, { action: "getSuppliers" });
        if (res.ok) {
            const data = await res.json();
            supplierList = Array.isArray(data) ? data : (data.value || data.body || []);
            renderSupplierDropdown();
        }
    } catch (err) {
        console.warn("Error fetching suppliers:", err);
    }
}

function renderSupplierDropdown() {
    const select = document.getElementById('supplierSelect');
    select.innerHTML = '<option value="">-- Select Supplier --</option>';
    
    // Sort suppliers alphabetically by name
    supplierList.sort((a, b) => {
        const nameA = (a.VendorName || "").toLowerCase();
        const nameB = (b.VendorName || "").toLowerCase();
        return nameA.localeCompare(nameB);
    });

    supplierList.forEach(sup => {
        const acc = sup.VendorAccount || "";
        const name = sup.VendorName || acc;
        if (acc) {
            select.innerHTML += `<option value="${acc}">${name} (${acc})</option>`;
        }
    });
}

async function loadDataverseVendorProfiles(isManual = false) {
    let rawData = null;
    try {
        const res = await fetchEndpoint(FETCH_PROFILES_URL, { action: "getProfiles" });
        if (res.ok) rawData = await res.json();
    } catch (apiErr) {
        console.warn('API Connection failed:', apiErr);
    }

    if (!rawData) {
        try {
            const localRes = await fetch('./vendor_mappings.json');
            if (localRes.ok) rawData = await localRes.json();
        } catch (localErr) {}
    }

    if (!rawData) {
        renderVendorDropdown();
        return;
    }

    let records = Array.isArray(rawData) ? rawData : (rawData.value || rawData.body || []);
    vendorProfiles = {};

    records.forEach(rec => {
        const vendorAccount = getProp(rec, ["manimp_vendoraccount", "VendorAccount", "vendoraccount", "vendor"]);
        if (!vendorAccount) return;

        const mapping = {};
        ALL_TARGET_FIELDS.forEach(field => {
            const possibleKeys = [`manimp_${field.toLowerCase()}`, field, field.toLowerCase()];
            const matchedVal = getProp(rec, possibleKeys);
            if (matchedVal !== undefined && matchedVal !== null && matchedVal !== "") {
                mapping[field] = matchedVal;
            }
        });
        vendorProfiles[vendorAccount] = mapping;
    });

    renderVendorDropdown();
    if (availableSourceColumns.length > 0) autoDetectProfile();
}

async function loadStorageLocations() {
    let rawData = null;
    try {
        const res = await fetchEndpoint(FETCH_LOCATIONS_URL, { action: "getWarehouses" });
        if (res.ok) rawData = await res.json();
    } catch (err) {}

    if (!rawData) {
        try {
            const sRes = await fetch('./storage_locations.json');
            if (sRes.ok) rawData = await sRes.json();
        } catch (err) {}
    }

    storageLocations = Array.isArray(rawData) ? rawData : (rawData ? rawData.value || rawData.body || [] : []);
    if (availableSourceColumns.length > 0) renderMappingControls();
}

function renderVendorDropdown() {
    const select = document.getElementById('profileSelect');
    select.innerHTML = '<option value="">Custom Mapping</option>';
    Object.keys(vendorProfiles).forEach(vendor => {
        select.innerHTML += `<option value="${vendor}">${vendor}</option>`;
    });
}

function getUniqueWarehouses() {
    const map = new Map();
    const list = [];
    storageLocations.forEach(item => {
        const code = getProp(item, ["WarehouseCode", "Warehouse_code", "warehouse_code", "warehouse_name"]);
        const name = getProp(item, ["WarehouseName", "warehouse_name", "Warehouse_name"]) || code;
        if (code && !map.has(code)) {
            map.set(code, true);
            list.push({ code, name });
        }
    });

    // Sort warehouses ascending by code
    return list.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true, sensitivity: 'base' }));
}

loadSuppliers();
loadDataverseVendorProfiles(false);
loadStorageLocations();

function handleFile() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    if (!file) return;

    if (!currentUploadId) {
        currentUploadId = generateUploadId();
        updateUploadIdDisplay();
    }

    const userRowInput = parseInt(document.getElementById('headerOffset').value) || 1;
    const sheetRangeOffset = Math.max(0, userRowInput - 1);

    const reader = new FileReader();
    reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        rawWorkbookData = {};
        const sheetSelect = document.getElementById('rawSheetSelect');
        const activeBeforeReload = currentSelectedSheet || sheetSelect.value;

        sheetSelect.innerHTML = '';
        workbook.SheetNames.forEach(sheetName => {
            sheetSelect.innerHTML += `<option value="${sheetName}">${sheetName}</option>`;
            const worksheet = workbook.Sheets[sheetName];
            
            const json = XLSX.utils.sheet_to_json(worksheet, { range: sheetRangeOffset, defval: "" });
            rawWorkbookData[sheetName] = json;
        });

        if (activeBeforeReload && workbook.SheetNames.includes(activeBeforeReload)) {
            sheetSelect.value = activeBeforeReload;
            currentSelectedSheet = activeBeforeReload;
        } else {
            currentSelectedSheet = sheetSelect.value;
        }

        onSheetChange();

        document.getElementById('rawPreviewCard').style.display = 'block';
        document.getElementById('mappingCard').style.display = 'block';
        document.getElementById('uploadBtn').disabled = false;
    };

    reader.readAsArrayBuffer(file);
}

function onSheetChange() {
    const selectedSheet = document.getElementById('rawSheetSelect').value;
    currentSelectedSheet = selectedSheet;
    const rows = rawWorkbookData[selectedSheet] || [];

    availableSourceColumns = [];
    if (rows.length > 0) {
        Object.keys(rows[0]).forEach(col => {
            if (!availableSourceColumns.includes(col)) availableSourceColumns.push(col);
        });
    }

    renderRawPreview();
    renderMappingControls();
    autoDetectProfile();
}

function renderRawPreview() {
    const container = document.getElementById('rawPreviewContainer');
    const selectedSheet = document.getElementById('rawSheetSelect').value;
    const rows = rawWorkbookData[selectedSheet] || [];

    if (rows.length === 0) {
        container.innerHTML = '<p style="color:#888;">No data found in this sheet.</p>';
        return;
    }

    const headers = Object.keys(rows[0]);
    let tableHtml = '<table><thead><tr>';
    headers.forEach(h => tableHtml += `<th>${h}</th>`);
    tableHtml += '</tr></thead><tbody>';

    rows.slice(0, 5).forEach(row => {
        tableHtml += '<tr>';
        headers.forEach(h => tableHtml += `<td>${row[h] !== undefined ? row[h] : ''}</td>`);
        tableHtml += '</tr>';
    });
    tableHtml += '</tbody></table>';
    container.innerHTML = tableHtml;
}

function buildGridHtml(fields, isSupplierGroup = false) {
    const selectedSheet = document.getElementById('rawSheetSelect').value;
    const sampleRow = (rawWorkbookData[selectedSheet] && rawWorkbookData[selectedSheet][0]) ? rawWorkbookData[selectedSheet][0] : {};
    const warehouses = getUniqueWarehouses();

    let gridHtml = '';
    fields.forEach(baseField => {
        const fieldKey = isSupplierGroup ? `${baseField}Ext` : baseField;
        let optionsHtml = `<option value="[ Ignore Field ]">[ Ignore Field ]</option>`;
        
        if (baseField === "Warehouse") {
            optionsHtml += `<optgroup label="Static Warehouse Selection">`;
            warehouses.forEach(wh => {
                optionsHtml += `<option value="STATIC:${wh.code}">Static: ${wh.code} | ${wh.name}</option>`;
            });
            optionsHtml += `</optgroup><optgroup label="Excel File Columns">`;
        }

        availableSourceColumns.forEach(srcCol => {
            const sampleValue = sampleRow[srcCol] !== undefined ? String(sampleRow[srcCol]).trim() : '';
            const previewText = sampleValue ? ` (e.g. "${sampleValue.substring(0, 18)}")` : ' (empty)';
            
            const matchTarget = isSupplierGroup ? `${baseField.toLowerCase()}ext` : baseField.toLowerCase();
            const isMatch = srcCol.toLowerCase().replace(/[^a-z0-9]/g, '') === matchTarget.replace(/[^a-z0-9]/g, '');
            optionsHtml += `<option value="${srcCol}" ${isMatch ? 'selected' : ''}>${srcCol}${previewText}</option>`;
        });

        if (baseField === "Warehouse") {
            optionsHtml += `</optgroup>`;
        }

        const rawLabel = FIELD_LABELS[baseField] || baseField;
        const displayLabel = isSupplierGroup ? `${rawLabel} (Supplier Ext)` : rawLabel;

        gridHtml += `
            <div class="map-box">
                <label>${displayLabel}</label>
                <select id="map_${fieldKey}" onchange="applyMapping()" style="width:100%;">${optionsHtml}</select>
            </div>
        `;
    });

    return gridHtml;
}

function renderMappingControls() {
    document.getElementById('supplierMappingGrid').innerHTML = buildGridHtml(BASE_FIELDS, true);
    document.getElementById('d365MappingGrid').innerHTML = buildGridHtml(BASE_FIELDS, false);
}

function autoDetectProfile() {
    let bestMatch = "", highestScore = 0;
    const allHeaders = availableSourceColumns.map(c => c.toLowerCase().trim());

    Object.entries(vendorProfiles).forEach(([vendor, mapping]) => {
        const matches = Object.values(mapping).filter(src => allHeaders.includes(String(src).toLowerCase().trim())).length;
        if (matches > highestScore) {
            highestScore = matches;
            bestMatch = vendor;
        }
    });

    if (highestScore > 0) {
        document.getElementById('profileSelect').value = bestMatch;
        onProfileChange();
    } else {
        applyMapping();
    }
}

function onProfileChange() {
    const vendorAccount = document.getElementById('profileSelect').value;
    document.getElementById('supplierSelect').value = vendorAccount;

    if (!vendorAccount || !vendorProfiles[vendorAccount]) {
        applyMapping();
        return;
    }

    const mapping = vendorProfiles[vendorAccount];
    ALL_TARGET_FIELDS.forEach(field => {
        const select = document.getElementById(`map_${field}`);
        if (!select) return;

        const savedSourceCol = mapping[field];
        if (!savedSourceCol) {
            select.value = "[ Ignore Field ]";
            return;
        }

        const matchedOption = Array.from(select.options).find(opt => 
            opt.value.toLowerCase().trim() === String(savedSourceCol).toLowerCase().trim()
        );
        select.value = matchedOption ? matchedOption.value : "[ Ignore Field ]";
    });

    applyMapping();
}

async function saveVendorProfile() {
    let vendorAccount = document.getElementById('supplierSelect').value;
    if (!vendorAccount) vendorAccount = document.getElementById('profileSelect').value;
    if (!vendorAccount) return alert('Please select a Supplier Account from the dropdown.');

    const payload = { "manimp_vendoraccount": vendorAccount };
    const localMapping = {};

    ALL_TARGET_FIELDS.forEach(field => {
        const select = document.getElementById(`map_${field}`);
        const val = select ? select.value : "[ Ignore Field ]";
        const dvKey = `manimp_${field.toLowerCase()}`;

        if (val !== "[ Ignore Field ]") {
            payload[dvKey] = val;
            localMapping[field] = val;
        } else {
            payload[dvKey] = "";
        }
    });

    try {
        const res = await fetch(SAVE_PROFILE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            vendorProfiles[vendorAccount] = localMapping;
            renderVendorDropdown();
            document.getElementById('profileSelect').value = vendorAccount;
            alert(`Profile for '${vendorAccount}' successfully saved to Dataverse!`);
        } else {
            alert(`Error saving to Dataverse: HTTP ${res.status}`);
        }
    } catch (err) {
        alert(`Connection failed: ${err.message}`);
    }

    applyMapping();
}

function applyMapping() {
    const currentMapping = {};
    ALL_TARGET_FIELDS.forEach(field => {
        const select = document.getElementById(`map_${field}`);
        if (select) currentMapping[field] = select.value;
    });

    const activeSheet = document.getElementById('rawSheetSelect').value;
    const rawRows = rawWorkbookData[activeSheet] || [];

    transformedPayloadData = rawRows.map(row => {
        const transformedRow = {};
        ALL_TARGET_FIELDS.forEach(target => {
            const src = currentMapping[target];
            if (src && src !== "[ Ignore Field ]") {
                if (src.startsWith("STATIC:")) {
                    transformedRow[target] = src.replace("STATIC:", "");
                } else {
                    transformedRow[target] = row[src] !== undefined && row[src] !== null ? String(row[src]).trim() : "";
                }
            } else {
                transformedRow[target] = "";
            }
        });
        return transformedRow;
    }).filter(row => Object.values(row).some(val => val !== "" && val !== null && val !== undefined));

    renderPreview();
}

function renderPreview() {
    const container = document.getElementById('previewContainer');
    const badge = document.getElementById('recordCountBadge');
    container.innerHTML = '';

    badge.innerText = `${transformedPayloadData.length} Records`;
    updateUploadIdDisplay();

    if (transformedPayloadData.length === 0) {
        container.innerHTML = '<p style="color:#888;">No transformed rows generated.</p>';
        document.getElementById('previewCard').style.display = 'block';
        return;
    }

    let tableHtml = `<div class="table-scroll"><table><thead><tr>`;
    ALL_TARGET_FIELDS.forEach(f => {
        const base = f.endsWith("Ext") ? f.slice(0, -3) : f;
        const rawLabel = FIELD_LABELS[base] || base;
        const label = f.endsWith("Ext") ? `${rawLabel} (Ext)` : rawLabel;
        tableHtml += `<th>${label}</th>`;
    });
    tableHtml += `</tr></thead><tbody>`;

    transformedPayloadData.slice(0, 10).forEach(row => {
        tableHtml += `<tr>`;
        ALL_TARGET_FIELDS.forEach(f => tableHtml += `<td>${row[f] || ''}</td>`);
        tableHtml += `</tr>`;
    });
    tableHtml += `</tbody></table></div>`;

    if (transformedPayloadData.length > 10) {
        tableHtml += `<p style="font-size:12px; color:#666; margin-top:8px;"><em>Showing first 10 of ${transformedPayloadData.length} records...</em></p>`;
    }

    container.innerHTML = tableHtml;
    document.getElementById('previewCard').style.display = 'block';
}

async function uploadPayload() {
    const file = document.getElementById('fileInput').files[0];
    if (!currentUploadId) currentUploadId = generateUploadId();

    const payload = {
        uploadId: currentUploadId,
        fileName: file.name,
        templateType: "TD_IntakeArrivalLineStaging",
        vendorProfile: document.getElementById('supplierSelect').value || document.getElementById('profileSelect').value || "Custom",
        data: transformedPayloadData
    };

    try {
        const res = await fetch(FLOW_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) alert(`Successfully uploaded payload!\n\nUpload ID: ${currentUploadId}`);
        else alert(`Error uploading: HTTP ${res.status}`);
    } catch (err) {
        alert(`Connection failed: ${err.message}`);
    }
}
</script>
